[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-shifter"
version = "0.1.0"
description = "Утилита для анализа слоистых кристаллических структур"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pymatgen",
    "networkx",
    "matplotlib",
    "numpy",
]

[project.scripts]
layer-shifter = "layer_shifter.main:main"
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
